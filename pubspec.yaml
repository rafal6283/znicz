name: znicz
description: Znicz - prywatny notatnik grobów bliskich z nawigacją GPS, rocznicami i dziennikiem wizyt.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  file_picker: ^10.1.0
  archive: '>=3.6.1 <5.0.0'
  geolocator: ^14.0.0
  flutter_compass: ^0.8.1
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  share_plus: ^11.0.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  google_mlkit_text_recognition: ^0.15.0
  exif: ^3.3.0
  speech_to_text: ^7.0.0
  http: ^1.2.2
  permission_handler: '>=11.3.0 <13.0.0'
  xml: ^6.5.0
  flutter_secure_storage: ^9.2.4
  koofr_backup_ui:
    git:
      url: https://github.com/rafal6283/nocny-licznik
      path: packages/koofr_backup_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: '#1E2433'
  adaptive_icon_foreground: assets/icon_fg.png

flutter:
  uses-material-design: true
